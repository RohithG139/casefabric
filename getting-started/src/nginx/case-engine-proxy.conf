server {
    listen 2027;

    location / {
        proxy_pass http://case-engine:2027;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The engine binds to 0.0.0.0 (required so Docker can publish its port) and
        # echoes that same address into the OpenAPI "servers" URL. Browsers can't
        # connect to 0.0.0.0, so rewrite it to the host-reachable address here.
        sub_filter_types application/json text/html;
        sub_filter 'http://0.0.0.0:2027' 'http://localhost:2027';
        sub_filter_once off;
    }
}
